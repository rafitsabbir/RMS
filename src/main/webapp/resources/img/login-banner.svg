<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
	<!-- Login page banner: abstract shapes and a candidate scorecard. Colours: docs/conventions.md (UI theme) -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0f2a44"/>
			<stop offset="0.55" stop-color="#16406e"/>
			<stop offset="1" stop-color="#1f5fa8"/>
		</linearGradient>
		<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.16"/>
		</pattern>
	</defs>
	<rect width="800" height="1000" fill="url(#bg)"/>
	<circle cx="720" cy="110" r="270" fill="#ffffff" fill-opacity="0.05"/>
	<circle cx="60" cy="930" r="320" fill="#ffffff" fill-opacity="0.05"/>
	<circle cx="640" cy="860" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
	<rect x="560" y="300" width="176" height="132" fill="url(#dots)"/>
	<rect x="70" y="420" width="132" height="110" fill="url(#dots)"/>

	<!-- Cards behind -->
	<rect x="236" y="470" width="340" height="300" rx="22" fill="#ffffff" fill-opacity="0.10" transform="rotate(-8 406 620)"/>
	<rect x="236" y="470" width="340" height="300" rx="22" fill="#ffffff" fill-opacity="0.16" transform="rotate(5 406 620)"/>

	<!-- Scorecard -->
	<g transform="translate(236 470)">
		<rect width="340" height="300" rx="22" fill="#ffffff"/>
		<circle cx="62" cy="64" r="30" fill="#dbe7f5"/>
		<circle cx="62" cy="56" r="11" fill="#1f5fa8"/>
		<path d="M41 82c2-12 10-18 21-18s19 6 21 18" fill="#1f5fa8"/>
		<rect x="110" y="44" width="150" height="14" rx="7" fill="#0f2a44"/>
		<rect x="110" y="70" width="104" height="10" rx="5" fill="#b8c4d3"/>

		<g fill="#14a38b">
			<circle cx="46" cy="138" r="11"/>
			<circle cx="46" cy="178" r="11"/>
			<circle cx="46" cy="218" r="11"/>
		</g>
		<g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
			<path d="M41 138l3.5 3.5 6.5-7"/>
			<path d="M41 178l3.5 3.5 6.5-7"/>
			<path d="M41 218l3.5 3.5 6.5-7"/>
		</g>
		<g fill="#e3e8ef">
			<rect x="70" y="132" width="230" height="12" rx="6"/>
			<rect x="70" y="172" width="230" height="12" rx="6"/>
			<rect x="70" y="212" width="230" height="12" rx="6"/>
		</g>
		<g fill="#1f5fa8">
			<rect x="70" y="132" width="196" height="12" rx="6"/>
			<rect x="70" y="172" width="150" height="12" rx="6"/>
			<rect x="70" y="212" width="214" height="12" rx="6"/>
		</g>
		<rect x="30" y="252" width="120" height="26" rx="13" fill="#d7f2ec"/>
		<rect x="46" y="261" width="88" height="8" rx="4" fill="#14a38b"/>
	</g>

	<!-- Floating badge -->
	<g transform="translate(560 440)">
		<circle r="38" fill="#14a38b"/>
		<path d="M-14 1l9 9 19-20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
	</g>
</svg>
