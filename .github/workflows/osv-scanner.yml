# Dependency vulnerability scan with OSV-Scanner, including Maven transitive dependencies
# (docs/build-run.md). A PR fails only on vulnerabilities it introduces. Pushes, the weekly run
# (which GitHub runs from the default branch only) and manual runs scan everything and report
# to Security > Code scanning.
name: OSV-Scanner

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-full:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
