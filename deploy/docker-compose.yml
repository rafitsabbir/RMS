# Local trial of the RMS container (Dockerfile) with a throwaway MySQL built from ../db/schema.sql and the
# synthetic ../db/test-seed.sql. Not for production: the database is a throwaway, and it holds only test data.
# Build the WAR first (./mvnw -B package), set RMS_DB_PASSWORD in your shell (never commit it), then from this
# folder:
#   docker compose up -d --build      start; open http://127.0.0.1:8080/rms/login (seed users: db/test-seed.sql)
#   docker compose down -v            stop and delete the data and documents
# Only the RMS port is published, on 127.0.0.1; MySQL is reachable only inside this Compose network.
# See docs/build-run.md, "Container".
name: rms-trial

services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: ${RMS_DB_PASSWORD:?Set RMS_DB_PASSWORD in your shell first}
      MYSQL_DATABASE: rms_local
      # The application's own account, with rights on rms_local only
      MYSQL_USER: rms
      MYSQL_PASSWORD: ${RMS_DB_PASSWORD:?Set RMS_DB_PASSWORD in your shell first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/test-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - rms-trial-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rms:
    build: ..
    image: rms:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Encrypted, as in production (deploy/tomcat/rms.xml): MySQL 8 sends a new account's password only over TLS
      RMS_DB_URL: jdbc:mysql://mysql:3306/rms_local?sslMode=REQUIRED
      RMS_DB_USER: rms
      RMS_DB_PASSWORD: ${RMS_DB_PASSWORD:?Set RMS_DB_PASSWORD in your shell first}
    ports:
      - "127.0.0.1:${RMS_HTTP_PORT:-8080}:8080"
    volumes:
      - rms-trial-docs:/var/rms/docs

volumes:
  rms-trial-data:
  rms-trial-docs:
